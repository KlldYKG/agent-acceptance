name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src/agent_acceptance
      - name: Tests with coverage
        run: pytest --cov=agent_acceptance --cov-report=term-missing --cov-fail-under=80

  # The composite action is exercised end-to-end by the demo repository
  # (KlldYKG/agent-acceptance-demo, pull_request_target) — see P1a D2.
